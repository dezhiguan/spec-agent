kind: Agent
spec:
  auth:
    audience: spec-agent
  eval:
    dataset: spec-agent/seed
  kind: workflow
  audit:
    captureFields:
    - request_id
  tools:
  - name: devflow.catalog.search
    risk: low
    access: read
    approval: none
  - name: devflow.stage.report
    risk: low
    access: write
    approval: none
  models:
    budget:
      dailyCny: 30.0
    default: qwen-plus
  prompts:
    items:
    - name: role
      type: text
    source: langfuse
  runtime:
    type: code
    endpoint: http://spec-agent.agents.svc.cluster.local:8000
    language: python
    liveness: k8s
  knowledge: []
  guardrails:
    pii: mask
    grounding: 'off'
    inputInjection: enforce
metadata:
  name: spec-agent
  owner: 研发效能组 / 官德志
  displayName: 生产需求分析师 spec-agent
apiVersion: keel/v1
